[pytest]
testpaths = tests
pythonpath = .
addopts = -m "not kafka"
markers =
    kafka: requires a running Kafka broker (docker compose); skipped by default
# Live logs: the job progress lines (event_forwarding.* loggers) show while tests run.
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
